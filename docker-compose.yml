version: "3.9"

services:

  db:
    image: mysql:8
    container_name: finance_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: finance_manager
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql 
  api:
    build: .
    container_name: finance_api
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"

  volumes:
    mysql_data: